<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#005e35" />
    <title>You're offline — Zeno</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        background: #f9f7ee;
        color: #072014;
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        text-align: center;
      }
      .card {
        max-width: 24rem;
      }
      .mark {
        width: 3rem;
        height: auto;
      }
      h1 {
        font-size: 1.25rem;
        margin: 1rem 0 0.5rem;
      }
      p {
        margin: 0 0 1.25rem;
        color: #4a5a52;
        font-size: 0.95rem;
        line-height: 1.5;
      }
      button {
        border: 0;
        border-radius: 999px;
        padding: 0.6rem 1.25rem;
        background: #005e35;
        color: #f9f7ee;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #072014;
          color: #f9f7ee;
        }
        p {
          color: #b9c7bf;
        }
      }
    </style>
  </head>
  <body>
    <main class="card">
      <svg
        class="mark"
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 46 40"
        fill="none"
        aria-hidden="true"
      >
        <g fill="#005e35">
          <path
            d="M0 33L4.60606 25H12.2448C17.2569 25 21.4947 28.7103 22.1571 33.6784L23 40H13L11.5585 36.6365C10.613 34.4304 8.44379 33 6.04362 33H0Z"
          />
          <path
            d="M46 33L41.3939 25H33.7552C28.7431 25 24.5053 28.7103 23.8429 33.6784L23 40H33L34.4415 36.6365C35.387 34.4304 37.5562 33 39.9564 33H46Z"
          />
          <path
            d="M4.60608 25L18.9999 0H23L22.6032 9.52405C22.2608 17.7406 15.7455 24.3596 7.53539 24.8316L4.60608 25Z"
          />
          <path
            d="M41.3939 25L27.0001 0H23L23.3968 9.52405C23.7392 17.7406 30.2545 24.3596 38.4646 24.8316L41.3939 25Z"
          />
        </g>
      </svg>
      <h1>You're offline</h1>
      <p>
        Zeno needs a connection to sync your transactions. Reconnect and your dashboard will pick up
        where you left off.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
